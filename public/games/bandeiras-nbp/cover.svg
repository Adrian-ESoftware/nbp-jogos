<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091526"/>
      <stop offset="50%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#062c30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#10b981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#091526" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="670" cy="270" r="390" fill="url(#glow)"/>

  <!-- Globe Grid Lines -->
  <g transform="translate(675, 255)" stroke="#38bdf8" stroke-opacity="0.22" fill="none" stroke-width="2">
    <circle cx="0" cy="0" r="185"/>
    <ellipse cx="0" cy="0" rx="110" ry="185"/>
    <ellipse cx="0" cy="0" rx="45" ry="185"/>
    <ellipse cx="0" cy="0" rx="185" ry="95"/>
    <ellipse cx="0" cy="0" rx="185" ry="35"/>
  </g>

  <!-- Floating Flag Cards -->
  <!-- Brazil Flag Card -->
  <g transform="translate(485, 85) rotate(-6)">
    <rect x="-8" y="-8" width="176" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="108" rx="8" fill="#009b3a"/>
    <polygon points="80,12 146,54 80,96 14,54" fill="#fedf00"/>
    <circle cx="80" cy="54" r="24" fill="#002776"/>
  </g>

  <!-- Japan Flag Card -->
  <g transform="translate(690, 75) rotate(7)">
    <rect x="-8" y="-8" width="176" height="124" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0" y="0" width="160" height="108" rx="8" fill="#ffffff"/>
    <circle cx="80" cy="54" r="30" fill="#bc002d"/>
  </g>

  <!-- Flagle / Compass Card -->
  <g transform="translate(540, 245)">
    <rect x="0" y="0" width="295" height="190" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2.5"/>
    <text x="24" y="36" font-family="sans-serif" font-size="13" font-weight="800" fill="#38bdf8" letter-spacing="2">FLAGLE &amp; BÚSSOLA</text>
    <rect x="24" y="54" width="247" height="36" rx="8" fill="#1e293b"/>
    <text x="38" y="77" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">🇦🇷 Argentina</text>
    <text x="165" y="77" font-family="sans-serif" font-size="14" font-weight="800" fill="#facc15">2.840 km ↗️</text>

    <rect x="24" y="100" width="247" height="36" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="38" y="123" font-family="sans-serif" font-size="15" font-weight="700" fill="#f8fafc">🇧🇷 Brasil</text>
    <text x="180" y="123" font-family="sans-serif" font-size="14" font-weight="800" fill="#34d399">0 km 🎯 100%</text>

    <text x="24" y="166" font-family="sans-serif" font-size="12" font-weight="700" fill="#94a3b8">Níveis 1 a 4 + 27 Estados do Brasil</text>
  </g>

  <!-- Title Left -->
  <text x="58" y="135" font-family="sans-serif" font-size="15" font-weight="800" letter-spacing="4" fill="#38bdf8">GEOGRAFIA MUNDIAL &amp; BRASIL</text>
  <text x="55" y="215" font-family="sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#f8fafc">ATLAS &amp;<tspan x="55" dy="0.95em" fill="#34d399">BANDEIRAS</tspan></text>
  <text x="58" y="345" font-family="sans-serif" font-size="18" fill="#cbd5e1">Quiz · Flagle com Distância · Mais ou Menos</text>
  <text x="58" y="375" font-family="sans-serif" font-size="16" fill="#94a3b8">250 países (Níveis 1 a 4) + 27 Estados Brasileiros</text>
  <text x="58" y="490" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#64748b">NBP GAMES · GEOGRAFIA INTERATIVA</text>
</svg>
