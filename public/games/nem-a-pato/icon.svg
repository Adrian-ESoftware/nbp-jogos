<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="duckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  
  <!-- Water waves in background -->
  <path d="M0,200 Q64,185 128,200 T256,200 L256,256 L0,256 Z" fill="#0284c7" opacity="0.4"/>
  <path d="M0,215 Q64,205 128,215 T256,215 L256,256 L0,256 Z" fill="#38bdf8" opacity="0.3"/>

  <!-- Duck Body -->
  <g filter="url(#shadow)">
    <!-- Main Body -->
    <path d="M50,155 C50,110 90,95 130,95 C145,95 165,100 178,112 C205,105 220,125 210,150 C202,170 178,185 130,185 C75,185 50,175 50,155 Z" fill="url(#duckGrad)"/>
    
    <!-- Wing -->
    <path d="M85,142 C85,128 115,122 135,130 C145,135 148,150 135,160 C115,170 85,160 85,142 Z" fill="#fde047" stroke="#ca8a04" stroke-width="3"/>
    
    <!-- Duck Head -->
    <circle cx="150" cy="85" r="46" fill="url(#duckGrad)"/>
    
    <!-- Top Feather / Tuft -->
    <path d="M145,40 C140,25 155,25 152,40 Z" fill="#facc15"/>
    <path d="M152,42 C150,22 165,26 158,42 Z" fill="#eab308"/>

    <!-- Duck Eye -->
    <circle cx="168" cy="74" r="11" fill="#fff"/>
    <circle cx="171" cy="74" r="6" fill="#0f172a"/>
    <circle cx="173" cy="71" r="2.5" fill="#fff"/>

    <!-- Eyebrow (Expressive / Challenging) -->
    <path d="M158,62 Q172,58 182,66" stroke="#854d0e" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Beak -->
    <path d="M185,78 C215,75 224,92 188,98 C182,99 180,88 185,78 Z" fill="url(#beakGrad)" stroke="#c2410c" stroke-width="2"/>
    
    <!-- Trivia Card on Chest -->
    <rect x="52" y="105" width="46" height="60" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="3" transform="rotate(-15 75 135)"/>
    <text x="70" y="142" font-family="'Arial Black', sans-serif" font-weight="900" font-size="24" fill="#ef4444" text-anchor="middle" transform="rotate(-15 75 135)">?</text>
  </g>

  <!-- Banner NEM A PATO! -->
  <g filter="url(#shadow)">
    <rect x="22" y="195" width="212" height="44" rx="14" fill="#facc15" stroke="#fff" stroke-width="3"/>
    <text x="128" y="226" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="0.5">NEM A PATO!</text>
  </g>
</svg>