<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="duckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="36" fill="url(#bg)"/>

  <!-- Pond Ripples -->
  <ellipse cx="600" cy="440" rx="550" ry="70" fill="#38bdf8" opacity="0.12"/>
  <ellipse cx="600" cy="440" rx="400" ry="50" fill="#38bdf8" opacity="0.2"/>

  <!-- Left: Cards Fan -->
  <g filter="url(#shadow)" transform="translate(140, 160) rotate(-18)">
    <rect width="180" height="260" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <rect x="16" y="16" width="148" height="36" rx="8" fill="#f59e0b"/>
    <text x="90" y="40" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">CIÊNCIA</text>
    <text x="90" y="90" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Quantos ossos tem</text>
    <text x="90" y="112" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">o corpo humano?</text>
    <circle cx="90" cy="170" r="34" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <text x="90" y="182" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#c2410c" text-anchor="middle">206</text>
  </g>

  <g filter="url(#shadow)" transform="translate(240, 140) rotate(8)">
    <rect width="180" height="260" rx="18" fill="#fff" stroke="#ec4899" stroke-width="4"/>
    <rect x="16" y="16" width="148" height="36" rx="8" fill="#ec4899"/>
    <text x="90" y="40" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#fff" text-anchor="middle">HISTÓRIA</text>
    <text x="90" y="90" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Quantos anos tem</text>
    <text x="90" y="112" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">um século?</text>
    <circle cx="90" cy="170" r="34" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <text x="90" y="182" font-family="'Arial Black', sans-serif" font-size="30" font-weight="900" fill="#c2410c" text-anchor="middle">100</text>
  </g>

  <!-- Right: Big Duck Character -->
  <g filter="url(#shadow)">
    <!-- Body -->
    <path d="M780,310 C780,225 870,190 955,190 C990,190 1030,200 1060,225 C1115,210 1150,250 1130,300 C1115,340 1060,370 955,370 C840,370 780,350 780,310 Z" fill="url(#duckGrad)"/>
    <path d="M855,290 C855,255 920,240 965,260 C985,270 990,300 965,325 C920,345 855,325 855,290 Z" fill="#fde047" stroke="#ca8a04" stroke-width="5"/>
    
    <!-- Head -->
    <circle cx="1000" cy="165" r="88" fill="url(#duckGrad)"/>
    <!-- Eye -->
    <circle cx="1040" cy="142" r="20" fill="#fff"/>
    <circle cx="1046" cy="142" r="11" fill="#0f172a"/>
    <circle cx="1050" cy="138" r="4" fill="#fff"/>
    <!-- Sunglasses -->
    <rect x="1005" y="126" width="62" height="34" rx="10" fill="#1e1b4b" opacity="0.95"/>
    <path d="M1012,132 L1030,154" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- Beak -->
    <path d="M1070,155 C1140,150 1155,188 1075,196 C1065,197 1060,175 1070,155 Z" fill="url(#beakGrad)" stroke="#c2410c" stroke-width="4"/>
  </g>

  <!-- Center Text / Brand -->
  <g filter="url(#shadow)">
    <rect x="420" y="45" width="460" height="88" rx="26" fill="#facc15" stroke="#fff" stroke-width="5"/>
    <text x="650" y="105" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="1.5">NEM A PATO!</text>

    <!-- Subtitle Pill -->
    <rect x="420" y="145" width="460" height="42" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="650" y="172" font-family="sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">
      O Hilário Party Game de Blefe e Trivia Numérica
    </text>

    <text x="650" y="225" font-family="sans-serif" font-size="18" font-weight="600" fill="#f8fafc" text-anchor="middle">
      📈 Diga sempre um número maior · Não passe da resposta real!
    </text>
    <text x="650" y="255" font-family="sans-serif" font-size="18" font-weight="600" fill="#facc15" text-anchor="middle">
      🚨 Acha que o amigo exagerou? Grite NEM A PATO!
    </text>
  </g>
</svg>