<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181320" />
      <stop offset="50%" stop-color="#0e0a14" />
      <stop offset="100%" stop-color="#060408" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe492" />
      <stop offset="50%" stop-color="#dfa938" />
      <stop offset="100%" stop-color="#9a6e16" />
    </linearGradient>
    <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#7a121d" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#dfa938" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#dfa938" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)" />
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="128" cy="120" r="110" fill="url(#glow)" />

  <!-- Dagger 1 (Left) -->
  <g transform="translate(128, 128) rotate(-45) translate(-128, -128)" filter="url(#shadow)">
    <path d="M128 36 L134 110 L128 122 L122 110 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M128 36 L128 122 L122 110 Z" fill="#cbd5e1" />
    <path d="M112 122 L144 122 L140 128 L116 128 Z" fill="url(#gold)" />
    <rect x="125" y="128" width="6" height="34" rx="2" fill="#332211" />
    <circle cx="128" cy="168" r="7" fill="url(#gold)" />
  </g>

  <!-- Dagger 2 (Right) -->
  <g transform="translate(128, 128) rotate(45) translate(-128, -128)" filter="url(#shadow)">
    <path d="M128 36 L134 110 L128 122 L122 110 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M128 36 L128 122 L122 110 Z" fill="#94a3b8" />
    <path d="M112 122 L144 122 L140 128 L116 128 Z" fill="url(#gold)" />
    <rect x="125" y="128" width="6" height="34" rx="2" fill="#332211" />
    <circle cx="128" cy="168" r="7" fill="url(#gold)" />
  </g>

  <!-- Crown (Center) -->
  <g filter="url(#shadow)">
    <path d="M72 168 L82 118 L108 140 L128 100 L148 140 L174 118 L184 168 Z" fill="url(#gold)" stroke="#fff" stroke-width="1" stroke-opacity="0.4" />
    <path d="M70 166 L186 166 L184 182 L72 182 Z" fill="url(#gold)" />
    <circle cx="128" cy="174" r="4.5" fill="url(#ruby)" />
    <circle cx="98" cy="174" r="3.5" fill="#38bdf8" />
    <circle cx="158" cy="174" r="3.5" fill="#38bdf8" />
    <circle cx="128" cy="98" r="4" fill="url(#gold)" />
    <circle cx="82" cy="116" r="3.5" fill="url(#gold)" />
    <circle cx="174" cy="116" r="3.5" fill="url(#gold)" />
  </g>

  <!-- Coin badge bottom -->
  <circle cx="128" cy="208" r="16" fill="url(#gold)" filter="url(#shadow)" />
  <circle cx="128" cy="208" r="13" fill="none" stroke="#7a550c" stroke-width="1.5" />
  <text x="128" y="214" font-family="'Cinzel', 'Times New Roman', serif" font-weight="900" font-size="14" fill="#583c07" text-anchor="middle">G</text>
</svg>
