<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e3a27" />
      <stop offset="50%" stop-color="#082418" />
      <stop offset="100%" stop-color="#03100a" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="glow" cx="950" cy="200" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)" />
  <circle cx="950" cy="200" r="350" fill="url(#glow)" />

  <!-- Typography -->
  <text x="80" y="100" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="4">NBP GAMES · CARTAS BRASILEIRAS</text>
  <text x="75" y="195" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="86" letter-spacing="-2">TRUCO GOIANO</text>
  <text x="80" y="245" fill="#a7f3d0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20">
    Zap, Copeta, Espadilha e Pica-fumo! Blefe, peça 6, 9 e 12 tentos no 1v1 e em Duplas.
  </text>

  <!-- Badges -->
  <g transform="translate(80, 280)">
    <rect width="180" height="44" rx="22" fill="url(#gold)" />
    <text x="90" y="28" fill="#140f1e" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="15" text-anchor="middle">
      1V1 &amp; DUPLAS 2V2
    </text>
  </g>
  <g transform="translate(280, 280)">
    <rect width="180" height="44" rx="22" fill="none" stroke="#34d399" stroke-width="2" />
    <text x="90" y="28" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" text-anchor="middle">
      BARALHO REAL
    </text>
  </g>
</svg>
