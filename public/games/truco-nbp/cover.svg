<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e3a27" />
      <stop offset="50%" stop-color="#082418" />
      <stop offset="100%" stop-color="#03100a" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="glow" cx="680" cy="270" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.7" />
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)" />
  <circle cx="680" cy="270" r="380" fill="url(#glow)" />
  <path d="M0 480 Q 320 380 600 540 L 0 540 Z" fill="#041a10" opacity="0.6" />

  <!-- Left Content -->
  <text x="70" y="120" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" letter-spacing="4">NBP GAMES APRESENTA</text>
  <text x="65" y="235" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="96" letter-spacing="-3">TRUCO</text>
  <text x="70" y="290" fill="#fde68a" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" letter-spacing="3">GOIANO</text>
  
  <text x="70" y="345" fill="#a7f3d0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20">
    Blefe, manilhas, vira e grito de 12 tentos · 1v1 e Duplas 2v2
  </text>

  <!-- Badges -->
  <g transform="translate(70, 390)">
    <rect width="180" height="46" rx="23" fill="url(#gold)" />
    <text x="90" y="29" fill="#140f1e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1">
      1V1 &amp; DUPLAS
    </text>
  </g>
  <g transform="translate(265, 390)">
    <rect width="210" height="46" rx="23" fill="none" stroke="#34d399" stroke-width="2" />
    <text x="105" y="29" fill="#34d399" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15" text-anchor="middle" letter-spacing="1">
      BARALHO REAL
    </text>
  </g>

  <!-- Right Cards -->
  <!-- Card 1: 7 Copas -->
  <g transform="translate(610, 260) rotate(-18) translate(-80, -115)" filter="url(#shadow)">
    <rect width="160" height="230" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
    <text x="22" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="32" fill="#dc2626">7</text>
    <path d="M22 55 L26 60 L30 55 A3 3 0 0 0 26 51 A3 3 0 0 0 22 55 Z" fill="#dc2626" transform="scale(1.4)" />
    <path d="M80 135 L65 118 A12 12 0 0 1 80 102 A12 12 0 0 1 95 118 Z" fill="#dc2626" />
  </g>

  <!-- Card 2: Zap (4 Paus) -->
  <g transform="translate(750, 250) rotate(12) translate(-80, -115)" filter="url(#shadow)">
    <rect width="160" height="230" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="4" />
    <text x="22" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="32" fill="#1e293b">4</text>
    <circle cx="26" cy="62" r="5" fill="#1e293b" />
    <!-- Center Club -->
    <g transform="translate(80, 118) scale(2.2)">
      <circle cx="0" cy="-6" r="5" fill="#1e293b" />
      <circle cx="-5" cy="1" r="5" fill="#1e293b" />
      <circle cx="5" cy="1" r="5" fill="#1e293b" />
      <path d="M-2 2 L-3 9 L3 9 L2 2 Z" fill="#1e293b" />
    </g>
    <rect x="30" y="175" width="100" height="30" rx="10" fill="#f59e0b" />
    <text x="80" y="196" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#000" text-anchor="middle">ZAP!</text>
  </g>
</svg>
