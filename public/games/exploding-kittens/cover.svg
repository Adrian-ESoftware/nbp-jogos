<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Exploding Kittens">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#8b1a1a" />
      <stop offset="60%" stop-color="#3d0909" />
      <stop offset="100%" stop-color="#140303" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#ff8c00" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ff8c00" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="55%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#d32f2f" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- Subtle table border -->
  <rect x="16" y="16" width="768" height="418" rx="22" fill="none" stroke="#c98a3b" stroke-opacity="0.35" stroke-width="3" />

  <!-- Decorative tilted cards -->
  <g transform="translate(155 225) rotate(-16)" filter="url(#shadow)">
    <rect x="-58" y="-84" width="116" height="168" rx="12" fill="#8b1818" stroke="#f5e6c8" stroke-width="4" />
    <rect x="-46" y="-72" width="92" height="144" rx="8" fill="#6b1010" stroke="#c98a3b" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="0" cy="-12" r="22" fill="#ff9800" opacity="0.9" />
    <path d="M-12 6 L-12 -10 L-5 -2 L5 -2 L12 -10 L12 6 Z" fill="#23120b" />
  </g>

  <g transform="translate(645 225) rotate(16)" filter="url(#shadow)">
    <rect x="-58" y="-84" width="116" height="168" rx="12" fill="#fffaf0" stroke="#e53935" stroke-width="5" />
    <circle cx="0" cy="-12" r="26" fill="#ffebee" stroke="#e53935" stroke-width="2" />
    <text x="0" y="-4" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#c62828">NÃO!</text>
    <text x="0" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#444">PARE A AÇÃO</text>
  </g>

  <!-- Central Bomb Cat Emblem -->
  <g transform="translate(400 170)" filter="url(#shadow)">
    <!-- Burst rays -->
    <polygon points="0,-105 16,-65 58,-85 45,-44 92,-44 58,-12 95,18 52,24 68,66 26,46 10,88 -12,48 -54,74 -42,30 -88,30 -54,-4 -92,-38 -46,-42 -62,-84 -18,-64" fill="#ff6d00" opacity="0.28" />
    <!-- Fuse -->
    <path d="M22 -52 Q44 -82 68 -72" fill="none" stroke="#d7ccc8" stroke-width="5" stroke-linecap="round" />
    <circle cx="71" cy="-71" r="9" fill="#ffeb3b" />
    <circle cx="71" cy="-71" r="4" fill="#ff5722" />
    <!-- Cat bomb body -->
    <circle cx="0" cy="0" r="56" fill="#1e1918" stroke="#ff9800" stroke-width="3.5" />
    <!-- Cat ears -->
    <polygon points="-44,-30 -52,-68 -16,-48" fill="#1e1918" stroke="#ff9800" stroke-width="3" stroke-linejoin="round" />
    <polygon points="44,-30 52,-68 16,-48" fill="#1e1918" stroke="#ff9800" stroke-width="3" stroke-linejoin="round" />
    <!-- Eyes -->
    <circle cx="-18" cy="-8" r="10" fill="#fff8e1" />
    <circle cx="18" cy="-8" r="10" fill="#fff8e1" />
    <circle cx="-16" cy="-8" r="4.5" fill="#111" />
    <circle cx="16" cy="-8" r="4.5" fill="#111" />
    <!-- Whiskers & nose -->
    <polygon points="-5,6 5,6 0,12" fill="#ff7043" />
    <path d="M-12 18 Q0 26 12 18" fill="none" stroke="#fff8e1" stroke-width="3" stroke-linecap="round" />
    <line x1="-42" y1="6" x2="-24" y2="8" stroke="#8d6e63" stroke-width="2" />
    <line x1="42" y1="6" x2="24" y2="8" stroke="#8d6e63" stroke-width="2" />
  </g>

  <!-- Title -->
  <text x="400" y="315" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="60" letter-spacing="2" fill="url(#titleGrad)" stroke="#1a0505" stroke-width="3" filter="url(#shadow)">EXPLODING</text>
  <text x="400" y="376" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="56" letter-spacing="4" fill="#fff5e6" stroke="#1a0505" stroke-width="2.5" filter="url(#shadow)">KITTENS</text>
  <text x="400" y="412" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="#ffcc80">SOLO VS BOTS • MULTIPLAYER P2P • 56 CARTAS ORIGINAIS</text>
</svg>
