<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="pokeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="pokeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Glowing Aura -->
  <circle cx="128" cy="128" r="88" fill="#e11d48" opacity="0.15" filter="blur(14px)"/>

  <!-- Pokeball Base Shadow & Body -->
  <g filter="url(#shadow)">
    <!-- Top Half (Red) -->
    <path d="M 40 128 A 88 88 0 0 1 216 128 Z" fill="url(#pokeTop)"/>
    <!-- Bottom Half (White) -->
    <path d="M 40 128 A 88 88 0 0 0 216 128 Z" fill="url(#pokeBottom)"/>
    <!-- Specular Highlight Curve -->
    <path d="M 58 100 A 74 74 0 0 1 198 100" fill="none" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <!-- Middle Dark Band -->
    <rect x="36" y="122" width="184" height="12" fill="#0f172a"/>
    <!-- Outer Button Ring -->
    <circle cx="128" cy="128" r="30" fill="#0f172a"/>
    <!-- Inner White Button Ring -->
    <circle cx="128" cy="128" r="22" fill="#f8fafc"/>
    <!-- Center Core Button with Cyan Glow -->
    <circle cx="128" cy="128" r="14" fill="url(#centerGlow)"/>
    <circle cx="125" cy="125" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
