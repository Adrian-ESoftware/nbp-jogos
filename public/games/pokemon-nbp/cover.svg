<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="35%" stop-color="#4c0519"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="spotlight" cx="0.72" cy="0.48" r="0.55">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Card 3D gradients -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="c-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.85"/>
    </filter>

    <filter id="glow-pill">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="540" fill="url(#c-bg)"/>
  <rect width="960" height="540" fill="url(#spotlight)"/>

  <!-- Subtle Pokedex Tech Circuit Lines -->
  <g stroke="#fda4af" stroke-opacity="0.1" stroke-width="2" fill="none">
    <path d="M 0 100 L 220 100 L 280 160 L 560 160"/>
    <path d="M 0 440 L 180 440 L 240 380 L 620 380"/>
    <circle cx="280" cy="160" r="4" fill="#fda4af" fill-opacity="0.2"/>
    <circle cx="240" cy="380" r="4" fill="#fda4af" fill-opacity="0.2"/>
  </g>

  <!-- Pokedex Sensor Lens (Top-Left) -->
  <g transform="translate(68, 60)">
    <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#0284c7"/>
    <circle cx="0" cy="0" r="23" fill="#38bdf8"/>
    <ellipse cx="-8" cy="-8" rx="8" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-30 -8 -8)"/>
    <!-- Small indicator LEDs -->
    <circle cx="48" cy="-14" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <circle cx="68" cy="-14" r="7" fill="#facc15" stroke="#854d0e" stroke-width="1.5"/>
    <circle cx="88" cy="-14" r="7" fill="#22c55e" stroke="#14532d" stroke-width="1.5"/>
  </g>

  <!-- Left Side: Typography & Badges -->
  <g transform="translate(68, 170)">
    <!-- Pill Badge -->
    <g filter="url(#glow-pill)">
      <rect x="0" y="0" width="220" height="34" rx="17" fill="#991b1b" stroke="#f87171" stroke-width="1.5"/>
      <circle cx="17" cy="17" r="6" fill="#ef4444"/>
      <text x="34" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#fee2e2" letter-spacing="1.2">DESAFIO DOS 151 DA GEN 1</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">QUEM É ESSE</text>
    <text x="0" y="136" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#goldText)" letter-spacing="1">POKÉMON?</text>

    <!-- Subtitle description -->
    <text x="0" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1">
      Modo Silhueta Misteriosa &amp; Cores Originais
    </text>
    <text x="0" y="206" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Duelos Versus 1v1 e Battle Royale de Sobrevivência!
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="112" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="56" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">⚡ Solo Quiz</text>

      <rect x="122" y="0" width="104" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="174" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">⚔️ 1v1 P2P</text>

      <rect x="236" y="0" width="144" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="308" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">👑 Battle Royale</text>
    </g>
  </g>

  <!-- Right Side: Mystery Silhouette Card & Pokédex Display -->
  <g transform="translate(685, 270)" filter="url(#c-shadow)">
    <!-- Arena Display Frame -->
    <rect x="-190" y="-180" width="380" height="360" rx="32" fill="url(#cardGrad)" stroke="#3f3f46" stroke-width="3"/>
    <rect x="-172" y="-162" width="344" height="324" rx="22" fill="#09090b" stroke="#27272a" stroke-width="2"/>

    <!-- Focal Radial Glow inside the screen -->
    <circle cx="0" cy="0" r="140" fill="#0284c7" opacity="0.18" filter="blur(20px)"/>

    <!-- Pokedex Scanlines -->
    <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5">
      <line x1="-160" y1="-100" x2="160" y2="-100"/>
      <line x1="-160" y1="-50" x2="160" y2="-50"/>
      <line x1="-160" y1="0" x2="160" y2="0"/>
      <line x1="-160" y1="50" x2="160" y2="50"/>
      <line x1="-160" y1="100" x2="160" y2="100"/>
    </g>

    <!-- Giant Mystery Question Mark in Background -->
    <text x="0" y="55" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="200" font-weight="900" fill="#facc15" opacity="0.14">?</text>

    <!-- Silhouette of Pikachu (Iconic Pose) -->
    <path d="M -15 65 Q -35 60 -45 40 Q -60 5 -55 -25 Q -65 -60 -80 -85 Q -75 -95 -55 -70 Q -40 -40 -35 -20 Q -10 -35 20 -35 Q 40 -35 55 -20 Q 60 -40 75 -70 Q 95 -95 100 -85 Q 85 -60 75 -25 Q 80 5 65 40 Q 55 60 35 65 Q 10 75 -15 65 Z" fill="#000000" stroke="#facc15" stroke-width="4" stroke-opacity="0.9"/>
    
    <!-- Silhouette Lightning Tail on Back -->
    <path d="M 45 40 L 95 30 L 75 10 L 115 -10 L 100 -35 L 140 -50" fill="none" stroke="#facc15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Pokédex Screen Header & Footer Status -->
    <g transform="translate(0, -135)">
      <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#18181b"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">POKÉDEX #??? · SILHUETA ATIVA</text>
    </g>

    <g transform="translate(0, 135)">
      <rect x="-100" y="-12" width="200" height="24" rx="12" fill="#ef4444" opacity="0.9"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">QUEM É ELE?</text>
    </g>
  </g>
</svg>
