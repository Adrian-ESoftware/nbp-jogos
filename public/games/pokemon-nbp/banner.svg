<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="30%" stop-color="#4c0519"/>
      <stop offset="65%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <radialGradient id="b-spot" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="b-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <filter id="b-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#b-bg)"/>
  <rect width="600" height="900" fill="url(#b-spot)"/>

  <!-- Top Header / Pokedex Sensor -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="#f1f5f9" stroke-width="4"/>
    <circle cx="0" cy="0" r="28" fill="#0284c7"/>
    <circle cx="0" cy="0" r="24" fill="#38bdf8"/>
    <ellipse cx="-8" cy="-8" rx="8" ry="5" fill="#ffffff" opacity="0.8" transform="rotate(-30 -8 -8)"/>
    <circle cx="52" cy="-14" r="8" fill="#ef4444"/>
    <circle cx="74" cy="-14" r="8" fill="#facc15"/>
    <circle cx="96" cy="-14" r="8" fill="#22c55e"/>
  </g>

  <!-- Title block -->
  <g transform="translate(300, 155)" text-anchor="middle">
    <rect x="-110" y="-18" width="220" height="34" rx="17" fill="#991b1b" stroke="#f87171" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#fee2e2" letter-spacing="1.5">CLÁSSICOS GEN 1</text>

    <text x="0" y="60" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="900" fill="#ffffff">QUEM É ESSE</text>
    <text x="0" y="112" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" fill="url(#b-gold)" letter-spacing="1">POKÉMON?</text>
    <text x="0" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#cbd5e1">Silhueta Misteriosa ou Colorido</text>
  </g>

  <!-- Central Screen Frame (Tactile Pokédex Monitor) -->
  <g transform="translate(300, 510)" filter="url(#b-shadow)">
    <rect x="-220" y="-190" width="440" height="380" rx="28" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <rect x="-200" y="-170" width="400" height="340" rx="20" fill="#09090b" stroke="#27272a" stroke-width="2"/>

    <!-- Screen glow -->
    <circle cx="0" cy="0" r="130" fill="#facc15" opacity="0.15" filter="blur(24px)"/>

    <!-- Giant Mystery Question Mark -->
    <text x="0" y="65" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="240" font-weight="900" fill="#facc15" opacity="0.12">?</text>

    <!-- Silhouette of Pikachu -->
    <path d="M -20 70 Q -45 65 -55 45 Q -70 10 -65 -25 Q -75 -65 -95 -95 Q -90 -105 -65 -80 Q -45 -50 -40 -25 Q -10 -40 25 -40 Q 50 -40 65 -25 Q 70 -50 90 -80 Q 115 -105 120 -95 Q 100 -65 90 -25 Q 95 10 75 45 Q 65 65 40 70 Q 10 80 -20 70 Z" fill="#000000" stroke="#facc15" stroke-width="4.5"/>
    <path d="M 50 45 L 110 35 L 85 10 L 135 -15 L 115 -45 L 160 -60" fill="none" stroke="#facc15" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Screen Badge -->
    <rect x="-120" y="125" width="240" height="28" rx="14" fill="#ef4444"/>
    <text x="0" y="144" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">ADIVINHE O MONSTRO</text>
  </g>

  <!-- Bottom Pills (Modes) -->
  <g transform="translate(300, 785)">
    <g transform="translate(-150, 0)">
      <rect x="-55" y="-18" width="110" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">⚡ Solo</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-55" y="-18" width="110" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">⚔️ 1v1</text>
    </g>
    <g transform="translate(150, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">👑 Royale</text>
    </g>
  </g>
</svg>
