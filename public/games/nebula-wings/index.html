<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Nebula Wings · NBP Games</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game" aria-label="Área do jogo Nebula Wings"></div>
    <div class="hud">
      <div><span>PORTAIS</span><strong id="score">0</strong></div>
      <div class="hud-right">
        <div><span>RECORDE</span><strong id="best">0</strong></div>
        <button id="sound" aria-label="Ativar som" aria-pressed="false">
          Som: off</button
        ><button id="pause" aria-label="Pausar jogo" disabled>Pausa</button>
      </div>
    </div>
    <section id="panel" aria-labelledby="title">
      <span class="eyebrow">NBP GAMES ORIGINAL</span>
      <h1 id="title">NEBULA<br /><em>WINGS</em></h1>
      <p id="description">
        Um pequeno pássaro.<br />Um universo de possibilidades.
      </p>
      <div id="result" hidden></div>
      <button id="start">Começar a voar</button>
      <p class="instructions">
        Toque, clique ou pressione Espaço para voar.<br />P para pausar ·
        Atravesse os portais sem encostar.
      </p>
    </section>
    <div
      id="announcement"
      class="sr-only"
      role="status"
      aria-live="polite"
    ></div>
    <div class="signature">VOE MAIS LONGE. TENTE MAIS UMA VEZ.</div>
    <script src="vendor/phaser.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
